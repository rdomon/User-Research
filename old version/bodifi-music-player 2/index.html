<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bodifi Music Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Manrope:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="player-shell" id="app">
      <!-- ===== Top bar ===== -->
      <header class="topbar">
        <div class="brand-logo" aria-label="Bodifi">bodifi</div>
        <div class="system-status"><span class="connection-dot"></span>Wi-Fi connected</div>
        <time class="clock" id="clock">8:30PM</time>
        <button class="profile-button" id="profileButton" type="button" aria-label="Open instructor selection">
          <span class="avatar" id="profileAvatar">J</span>
          <span class="profile-copy">
            <strong id="profileName">Jordan M.</strong>
            <small>Instructor</small>
          </span>
        </button>
      </header>

      <!-- ===== Setup flow (steps 1-4) ===== -->
      <section class="setup-screen" id="setupScreen">
        <nav class="flow-progress" id="flowProgress" aria-label="Setup progress"></nav>

        <div class="setup-card">
          <button class="back-button" id="backButton" type="button"><span aria-hidden="true">‹</span> Back</button>
          <div class="setup-heading">
            <p id="setupEyebrow"></p>
            <h1 id="setupTitle"></h1>
            <span id="setupSub"></span>
          </div>
          <div id="setupBody"></div>
        </div>

        <button class="help-button" id="helpButton" type="button" aria-label="Help">
          ? <span>Help button</span>
        </button>
      </section>

      <!-- ===== Now playing ===== -->
      <section class="dashboard" id="dashboard" hidden>
        <section class="now-playing" aria-label="Now playing controls">
          <button class="expand-playlist-button" id="expandPlaylist" type="button" aria-label="Open playlist">
            <svg width="8" height="15" viewBox="0 0 10.5 19.5" fill="none"><path d="M0.75 18.75L9.75 9.75L0.75 0.75" stroke="#C8F542" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Playlist</span>
          </button>

          <div class="selection-context">
            <span id="ctxService">Spotify</span><i></i><span id="ctxClass">Power Circuit</span>
          </div>

          <div class="track-overview">
            <div class="album-art" id="albumArt"></div>
            <div class="track-copy">
              <p>Now playing</p>
              <h1 id="trackTitle">Run It Up</h1>
              <span id="trackArtist">Sienna Vale</span>
            </div>
          </div>

          <div class="timeline">
            <label class="sr-only" for="songProgress">Song progress</label>
            <input id="songProgress" type="range" min="0" max="100" step="0.1" value="0" />
            <div class="times"><span id="timeElapsed">0:00</span><span id="timeTotal">3:42</span></div>
          </div>

          <div class="transport">
            <button class="transport-button shuffle" id="shuffleBtn" type="button" aria-label="Shuffle playlist" aria-pressed="false">
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M19.25 7.33333V2.75H14.6667M19.25 2.75L3.66667 18.3333M14.6667 19.25H19.25V14.6667M19.25 19.25L13.75 13.75M3.66667 3.66667L8.25 8.25" stroke="currentColor" stroke-width="1.83333" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="transport-button" id="prevBtn" type="button" aria-label="Previous song">
              <svg width="28" height="29" viewBox="0 0 32.6823 33.849" fill="none"><path d="M32.6823 1.16667L10.1711 16.9245L32.6823 32.6823V1.16667Z" fill="#F3F1ED"/><path d="M1.16667 1.16667V32.6823" stroke="#F3F1ED" stroke-width="2.33333" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="play-button" id="playBtn" type="button" aria-label="Play"></button>
            <button class="transport-button" id="nextBtn" type="button" aria-label="Next song">
              <svg width="28" height="29" viewBox="0 0 32.6823 33.849" fill="none" style="transform: scaleX(-1)"><path d="M32.6823 1.16667L10.1711 16.9245L32.6823 32.6823V1.16667Z" fill="#F3F1ED"/><path d="M1.16667 1.16667V32.6823" stroke="#F3F1ED" stroke-width="2.33333" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>

          <div class="volume-control">
            <span>Volume</span>
            <label class="sr-only" for="volume">Volume</label>
            <input id="volume" type="range" min="0" max="100" value="72" />
            <strong id="volumeLabel">72%</strong>
          </div>
        </section>

        <aside class="playlist-panel" id="playlistPanel" aria-label="Playlist songs">
          <button class="collapse-playlist-button" id="collapsePlaylist" type="button" aria-label="Close playlist">
            <svg width="8" height="15" viewBox="0 0 10.5 19.5" fill="none"><path d="M0.75 18.75L9.75 9.75L0.75 0.75" stroke="#C8F542" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="playlist-header">
            <div>
              <p>Selected playlist</p>
              <h2 id="plName">Power Circuit</h2>
            </div>
            <button type="button" class="change-button" id="changePlaylist">Change</button>
          </div>
          <div class="playlist-summary" id="plSummary"></div>
          <div class="track-list" id="trackList"></div>
          <button class="browse-button" id="browseBtn" type="button">Browse all 24 tracks</button>
        </aside>
      </section>

      <!-- ===== Help dialog ===== -->
      <div class="help-overlay" id="helpOverlay" hidden>
        <div class="help-dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
          <strong id="helpTitle">Need help?</strong>
          <ol>
            <li>Check the WiiM connection, then try again.</li>
            <li>If the issue continues, contact the front desk.</li>
          </ol>
          <button type="button" id="helpClose">Close</button>
        </div>
      </div>

      <div class="toast" id="toast" role="status" hidden></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
